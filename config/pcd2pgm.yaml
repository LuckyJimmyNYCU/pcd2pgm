pcd2pgm:
  ros__parameters:

    # ======================================================================
    # 平常只改這一行
    # ======================================================================
    # 讀 <world_directory>/<input_subdir>/<map_name>.pcd
    # 寫 <world_directory>/<output_subdir>/<map_name>/<map_name>.pgm + .yaml
    map_name: "live_map_8f"

    world_directory: "/work/nav2_ws/src/world"
    input_subdir: "PCD"
    output_subdir: "2Dmap"

    # 完整路徑覆寫。非空時優先於上面的組合規則，留空表示不使用。
    #   input_pcd:       完整輸入路徑，含 .pcd
    #   output_basepath: 完整輸出路徑，「不含」副檔名，程式會自動接 .pgm / .yaml
    #   output_name:     只想讓輸出檔名跟 map_name 不同時才填
    input_pcd: ""
    output_basepath: ""
    output_name: ""

    thre_z_min: 0.3
    thre_z_max: 1.1
    # false = 保留區間內，true = 保留區間外
    flag_pass_through: false

    # ======================================================================
    # 半徑濾波（對高度切片後的點做）
    # ======================================================================
    use_radius_filter: true
    thre_radius: 0.5
    thres_point_count: 10

    # ======================================================================
    # 地圖輸出
    # ======================================================================
    map_resolution: 0.05
    padding: 0.5

    # false: 沒有點的格子填 254（free）。true: 填 205（unknown）。
    unknown_as_unknown: false

    # true: 地圖範圍取完整點雲的 XY，與同一份 PCD 產出的其他地圖對齊。
    # false: 只框住濾波後的障礙物點。
    bounds_from_full_cloud: true

    # 額外輸出 <output>_pass.pcd 與 <output>_radius.pcd 供檢查
    save_intermediate: false